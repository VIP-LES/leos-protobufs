syntax = "proto3";

package leos;

import "telemetry.proto";
import "command.proto";

message Packet {
  // at most 16 ASCII characters; see packet.options for nanopb bounds.
  string callsign = 1;
  uint32 sequence = 2;
  // sender uptime in milliseconds at packet creation, NOT UTC.
  uint64 timestamp_ms = 3;

  oneof payload {
    TelemetryPacket telemetry = 4;
    CommandPacket command = 5;
  }
}