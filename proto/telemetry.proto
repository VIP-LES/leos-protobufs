syntax = "proto3";

package leos;

import "beacon.proto";
import "efm.proto";
import "purpleboard.proto";

message LowRateTelemetry {
  PurpleboardTelemetry sensors = 1;
  Beacon beacon = 4;
}

message TelemetryPacket {
  oneof data {
    EfmReadings efm = 13;
    LowRateTelemetry low_rate = 14;
  }
}
